<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Unicare</title>

    <!-- PWA: manifest e icone (iPhone usa apple-touch-icon) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icone/icona-192.png" />
    <link rel="apple-touch-icon" href="/icone/apple-touch-icon.png" />
    <meta name="theme-color" content="#5D46EC" />
    <meta name="apple-mobile-web-app-title" content="Unicare" />

    <!-- Font Nunito (stile approvato in Fase 2) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <!-- Schermata d'avvio: il logo, finché l'app non è pronta (almeno 1,5 secondi). La toglie main.tsx. -->
    <style>
      #avvio { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #5D46EC; color: #fff; font-family: 'Nunito', system-ui, sans-serif; transition: opacity 0.4s ease; }
      #avvio svg { width: 160px; height: 124px; animation: avvio-entra 0.6s ease-out both; }
      #avvio span { font-size: 34px; font-weight: 800; letter-spacing: -0.01em; animation: avvio-entra 0.6s 0.15s ease-out both; }
      #avvio.via { opacity: 0; pointer-events: none; }
      @keyframes avvio-entra { from { opacity: 0; transform: translateY(10px) scale(0.96); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #avvio svg, #avvio span { animation: none; } #avvio { transition: none; } }
    </style>
  </head>
  <body>
    <div id="avvio" role="img" aria-label="Unicare">
      <svg viewBox="14 21 72 56" aria-hidden="true">
        <g transform="translate(14 13) scale(0.72)">
  <defs><clipPath id="splash-tetto"><polygon points="0,71.2 49.8,36.8 100,71.2 100,100 0,100"/></clipPath></defs>
  <path d="M 31.25 20 V 60.5 A 19.3 19.3 0 0 0 69.85 60.5 V 20" fill="none" stroke="#FFFFFF" stroke-width="11.4" clip-path="url(#splash-tetto)"/>
  <polygon points="2.5,52.3 49.8,14.2 66.3,27.5 66.3,21.6 75.5,21.6 75.5,34.9 97.8,52.3 83.1,52.3 49.8,29.8 17.2,52.3" fill="#FF7457"/>
  <path d="M 50 65.5 L 41.2 56.4 A 5.6 5.6 0 1 1 50 49.6 A 5.6 5.6 0 1 1 58.8 56.4 Z" fill="#FF7457"/>
  </g>
      </svg>
      <span>Unicare</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
