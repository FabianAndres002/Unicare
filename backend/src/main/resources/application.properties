spring.application.name=unicare

# ---- Database ----
# In sviluppo il backend avvia da solo un PostgreSQL integrato: niente da installare.
# I dati restano in backend/.database-locale (cancella la cartella per ripartire da zero).
# Porta 5433, così non va in conflitto con un eventuale PostgreSQL già installato.
unicare.database-integrato.attivo=${UNICARE_DATABASE_INTEGRATO:true}
unicare.database-integrato.cartella=.database-locale
unicare.database-integrato.porta=5433

# Usati solo con unicare.database-integrato.attivo=false (per esempio in produzione).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/unicare}
spring.datasource.username=${DB_USER:unicare}
spring.datasource.password=${DB_PASSWORD:unicare}

# Le tabelle le crea SOLO Flyway (cartella db/migration).
# Hibernate controlla che le classi @Entity corrispondano alle tabelle, ma non le modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Date salvate in UTC; i promemoria useranno Europe/Rome.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
