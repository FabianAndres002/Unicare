# Database PostgreSQL per lo sviluppo in locale.
# Avvio:  docker compose up -d     Stop:  docker compose down
# I dati restano nel volume "unicare-dati" anche dopo lo stop.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: unicare
      POSTGRES_USER: unicare
      POSTGRES_PASSWORD: unicare
    ports:
      - "5432:5432"
    volumes:
      - unicare-dati:/var/lib/postgresql/data
      # Crea anche il database dei test (unicare_test)
      - ./docker/crea-db-test.sql:/docker-entrypoint-initdb.d/crea-db-test.sql:ro

volumes:
  unicare-dati:
