# Configurazione per Render (https://render.com): un solo servizio che serve sia l'app sia le API.
# Su Render: New › Blueprint › scegli il repository Unicare. Le voci "sync: false" le scrivi tu
# (sono segrete: non vanno mai su GitHub).
#
# Il database è il PostgreSQL integrato (PGlite), salvato sul disco del servizio: niente altri
# account. Render fa ogni giorno una copia del disco (backup). Per crescere si potrà passare a un
# PostgreSQL esterno scrivendo DATABASE_URL.
services:
  - type: web
    name: unicare
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: cd frontend && npm ci --include=dev && npm run build && cd ../backend && npm ci --include=dev
    startCommand: cd backend && npm start
    healthCheckPath: /api/stato
    disk:
      name: dati
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: CARTELLA_DATABASE
        value: /var/data/database
      - key: JWT_SECRET
        generateValue: true
      - key: CODICE_REGISTRAZIONE
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DEEPL_API_KEY
        sync: false
